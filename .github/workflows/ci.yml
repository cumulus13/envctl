name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: fmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

      # this wrong/mistake
      # - name: go test (platform-neutral logic: args, match, color, display)
      #   run: go test ./... -v

      - name: "go test (platform-neutral logic: args, match, color, display)"
        run: go test ./... -v

  build:
    name: cross-compile
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, 386, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: build windows/${{ matrix.goarch }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -o envctl-windows-${{ matrix.goarch }}.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: envctl-windows-${{ matrix.goarch }}
          path: envctl-windows-${{ matrix.goarch }}.exe
          if-no-files-found: error

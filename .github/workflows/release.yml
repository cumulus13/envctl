name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build windows/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, 386, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: go vet
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/envctl.exe .
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/envlist.exe .
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/env.exe .

      - name: package
        run: |
          cp README.md dist/
          cd dist
          zip -r ../envctl-${{ github.ref_name }}-windows-${{ matrix.goarch }}.zip envctl.exe envlist.exe env.exe README.md

      - uses: actions/upload-artifact@v4
        with:
          name: envctl-${{ github.ref_name }}-windows-${{ matrix.goarch }}
          path: envctl-${{ github.ref_name }}-windows-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
